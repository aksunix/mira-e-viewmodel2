<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CS2 Demo Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --md-primary: #9C4328;
    --md-on-primary: #FFFFFF;
    --md-primary-container: #FFDBD0;
    --md-on-primary-container: #3A0B00;
    --md-secondary-container: #F7DDD5;
    --md-on-secondary-container: #2C1510;
    --md-surface: #FFF8F6;
    --md-surface-container-low: #FFF1ED;
    --md-surface-container: #FCEAE5;
    --md-surface-container-high: #F6E4DF;
    --md-surface-container-highest: #F1DFDA;
    --md-on-surface: #231917;
    --md-on-surface-variant: #53433F;
    --md-outline: #85736E;
    --md-outline-variant: #D8C2BC;
    --md-inverse-surface: #392E2B;
    --md-inverse-on-surface: #FFEDE8;
    --md-error: #BA1A1A;
    --md-error-container: #FFDAD6;
    --md-on-error-container: #410002;
    --md-shadow: 0 1px 3px 1px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary: #FFB5A0;
      --md-on-primary: #5F1600;
      --md-primary-container: #862200;
      --md-on-primary-container: #FFDBD0;
      --md-secondary-container: #5D4037;
      --md-on-secondary-container: #FFDBD0;
      --md-surface: #1A110F;
      --md-surface-container-low: #231917;
      --md-surface-container: #271D1B;
      --md-surface-container-high: #322825;
      --md-surface-container-highest: #3D3230;
      --md-on-surface: #F1DFDA;
      --md-on-surface-variant: #D8C2BC;
      --md-outline: #A08C87;
      --md-outline-variant: #53433F;
      --md-inverse-surface: #F1DFDA;
      --md-inverse-on-surface: #392E2B;
      --md-error: #FFB4AB;
      --md-error-container: #93000A;
      --md-on-error-container: #FFDAD6;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Roboto", system-ui, sans-serif;
    font-size: 14px; line-height: 20px; letter-spacing: .25px;
    background: var(--md-surface); color: var(--md-on-surface);
    min-height: 100vh;
  }

  /* Top app bar */
  .appbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px;
    height: 64px; padding: 0 16px 0 24px;
    background: var(--md-surface-container); color: var(--md-on-surface);
  }
  .appbar svg { fill: var(--md-primary); flex: none; }
  .appbar h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: 0; }

  main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 96px; }

  /* Dropzone */
  .dropzone {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 100%; padding: 48px 24px; text-align: center; font: inherit; color: inherit;
    background: var(--md-surface-container-low);
    border: 2px dashed var(--md-outline-variant); border-radius: 28px;
    cursor: pointer; transition: background .2s, border-color .2s;
  }
  .dropzone:hover { background: var(--md-surface-container); }
  .dropzone.hover { border-color: var(--md-primary); background: var(--md-surface-container-high); }
  .dropzone .icon {
    display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 8px;
    border-radius: 50%; background: var(--md-primary-container);
  }
  .dropzone .icon svg { fill: var(--md-on-primary-container); }
  .dropzone .title { font-size: 22px; line-height: 28px; letter-spacing: 0; }
  .dropzone .support { color: var(--md-on-surface-variant); }

  /* Buttons */
  .btn {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 24px; border: 0; border-radius: 20px;
    font: 500 14px/20px "Roboto", system-ui, sans-serif; letter-spacing: .1px;
    cursor: pointer; transition: box-shadow .2s;
  }
  .btn svg { fill: currentColor; margin-left: -8px; }
  .btn::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
  .btn:hover::after { opacity: .08; }
  .btn:active::after { opacity: .12; }
  .btn-filled { background: var(--md-primary); color: var(--md-on-primary); margin-top: 16px; }
  .btn-filled:hover { box-shadow: var(--md-shadow); }
  .btn-tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .btn-tonal.done { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .btn-text { background: transparent; color: var(--md-primary); padding: 0 12px; }
  :focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }

  /* Progress */
  .progress { display: none; margin-top: 24px; }
  .progress.on { display: block; }
  .progress .label { margin-bottom: 12px; color: var(--md-on-surface-variant); }
  .progress .label strong { display: block; color: var(--md-on-surface); font-weight: 500; font-size: 16px; line-height: 24px; letter-spacing: .15px; }
  .linear { position: relative; height: 4px; border-radius: 2px; overflow: hidden; background: var(--md-secondary-container); }
  .linear .bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--md-primary); border-radius: 2px; transition: width .2s linear; }
  .linear.indeterminate .bar { width: 40%; transition: none; animation: slide 1.6s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  .dropzone:disabled { cursor: progress; opacity: .6; }
  .dropzone:disabled:hover { background: var(--md-surface-container-low); }

  /* Banner de erro */
  .error {
    display: none; gap: 12px; align-items: flex-start; margin-top: 24px; padding: 16px;
    border-radius: 12px; background: var(--md-error-container); color: var(--md-on-error-container);
  }
  .error.on { display: flex; }
  .error svg { fill: currentColor; flex: none; }
  .error strong { display: block; font-weight: 500; font-size: 16px; line-height: 24px; letter-spacing: .15px; }

  /* Resultados */
  .results { display: none; margin-top: 32px; }
  .results.on { display: block; }
  .results-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .results-head h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: 0; }
  .results-head p { margin: 0; color: var(--md-on-surface-variant); }

  /* Cards (Material 3): midia, titulo, texto de apoio e acoes */
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 12px;
  }
  .card-media {
    position: relative; display: grid; place-items: center; height: 168px;
    background: var(--md-surface-container-highest);
  }
  .card-media canvas { width: 140px; height: 140px; }
  .card-media .ph {
    display: grid; place-items: center; width: 80px; height: 80px; border-radius: 50%;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    font-size: 36px; line-height: 40px; font-weight: 500; text-transform: uppercase;
  }
  .card-media .cap { position: absolute; left: 12px; bottom: 8px; color: var(--md-on-surface-variant); font-size: 12px; line-height: 16px; letter-spacing: .4px; }
  .card-body { padding: 16px 16px 0; }
  .card-title { margin: 0; font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: 0; overflow-wrap: anywhere; }
  .card-sub { margin-top: 2px; color: var(--md-on-surface-variant); font-family: "Roboto Mono", ui-monospace, monospace; font-size: 12px; line-height: 16px; letter-spacing: .4px; }
  .support { margin-top: 16px; }
  .support + .support { margin-top: 12px; }
  .support .lbl { color: var(--md-on-surface-variant); font-size: 12px; line-height: 16px; letter-spacing: .5px; }
  .support .txt { margin-top: 2px; color: var(--md-on-surface-variant); font-family: "Roboto Mono", ui-monospace, monospace; font-size: 12px; line-height: 18px; letter-spacing: 0; overflow-wrap: anywhere; user-select: all; }
  .support .txt.empty { font-family: "Roboto", system-ui, sans-serif; font-size: 14px; letter-spacing: .25px; user-select: none; opacity: .8; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding: 12px 8px 8px; min-height: 60px; }
  .actions .btn-text { text-transform: uppercase; letter-spacing: .8px; }

  @media (max-width: 600px) {
    .dropzone { padding: 32px 16px; }
  }

  /* Snackbar */
  .snackbar {
    position: fixed; left: 50%; bottom: 24px; z-index: 10;
    transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
    min-width: 280px; max-width: calc(100vw - 32px); padding: 14px 16px; border-radius: 4px;
    background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
    box-shadow: var(--md-shadow); transition: opacity .2s, transform .2s;
  }
  .snackbar.on { opacity: 1; transform: translate(-50%, 0); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .linear.indeterminate .bar { animation: none; left: 0; width: 100%; opacity: .5; }
  }
</style>
</head>
<body>

<header class="appbar">
  <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
  <h1>CS2 Demo Analyzer</h1>
</header>

<main>
  <button type="button" class="dropzone" id="dropzone">
    <span class="icon"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg></span>
    <span class="title">Arraste o arquivo .dem aqui</span>
    <span class="support">O arquivo é lido no seu computador e não é enviado para nenhum servidor</span>
    <span class="btn btn-filled" id="pick">Escolher arquivo</span>
  </button>
  <input type="file" id="fileInput" accept=".dem" class="sr" tabindex="-1">

  <section class="progress" id="progress" aria-live="polite">
    <div class="label"><strong id="progressTitle"></strong><span id="progressSub"></span></div>
    <div class="linear indeterminate" id="linear" role="progressbar" aria-label="Progresso da análise" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="bar"></div></div>
  </section>

  <section class="error" id="error" role="alert">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <div><strong>Não foi possível analisar o demo</strong><span id="errorText"></span></div>
  </section>

  <section class="results" id="results">
    <div class="results-head">
      <div>
        <h2>Jogadores encontrados</h2>
        <p id="resultCount"></p>
      </div>
      <button type="button" class="btn btn-text" id="again">Analisar outro demo</button>
    </div>
    <div id="cards"></div>
  </section>
</main>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<script src="crosshair.js"></script>
<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const pick = document.getElementById('pick');
const progress = document.getElementById('progress');
const progressTitle = document.getElementById('progressTitle');
const progressSub = document.getElementById('progressSub');
const linear = document.getElementById('linear');
const bar = document.getElementById('bar');
const errorBox = document.getElementById('error');
const errorText = document.getElementById('errorText');
const results = document.getElementById('results');
const resultCount = document.getElementById('resultCount');
const cards = document.getElementById('cards');
const snackbar = document.getElementById('snackbar');
let snackTimer;
let busy = false;
let worker = null;

function setIndeterminate(title, sub) {
  progressTitle.textContent = title;
  progressSub.textContent = sub || '';
  linear.classList.add('indeterminate');
  linear.removeAttribute('aria-valuenow');
  bar.style.width = '';
}

function setProgress(pct) {
  linear.classList.remove('indeterminate');
  linear.setAttribute('aria-valuenow', pct);
  bar.style.width = pct + '%';
  progressSub.textContent = pct + '% do demo lido';
}

function setLoading(on) {
  dropzone.disabled = on;
  if (on) {
    pick.textContent = 'Preparando o analisador…';
    setIndeterminate('Preparando o analisador', 'Só na primeira vez; o arquivo tem alguns MB.');
    progress.classList.add('on');
  } else {
    pick.textContent = 'Escolher arquivo';
    progress.classList.remove('on');
  }
}

function startWorker() {
  setLoading(true);
  try {
    worker = new Worker('worker.js');
  } catch (e) {
    setLoading(false);
    showError('Seu navegador não conseguiu iniciar o analisador. Tente o Chrome, Edge ou Firefox atualizados.');
    return;
  }
  worker.onmessage = e => {
    const m = e.data;
    if (m.type === 'ready') {
      setLoading(false);
    } else if (m.type === 'progress') {
      setProgress(m.value);
    } else if (m.type === 'result') {
      busy = false;
      progress.classList.remove('on');
      showResults(JSON.parse(m.json));
    } else if (m.type === 'error') {
      busy = false;
      setLoading(false);
      showError(m.message);
    }
  };
  worker.onerror = () => {
    busy = false;
    setLoading(false);
    showError('O analisador parou de responder. Isso pode acontecer com demos muito grandes em aparelhos com pouca memória. Recarregue a página e tente de novo.');
  };
}

dropzone.onclick = () => { if (!dropzone.disabled) fileInput.click(); };
dropzone.ondragover = e => { e.preventDefault(); if (!dropzone.disabled) dropzone.classList.add('hover'); };
dropzone.ondragleave = () => dropzone.classList.remove('hover');
dropzone.ondrop = e => {
  e.preventDefault();
  dropzone.classList.remove('hover');
  if (!dropzone.disabled && e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => {
  if (fileInput.files.length) processFile(fileInput.files[0]);
  fileInput.value = '';
};
document.getElementById('again').onclick = () => {
  results.classList.remove('on');
  dropzone.style.display = '';
  window.scrollTo({ top: 0 });
};

function processFile(file) {
  if (busy) return;
  if (!/\.dem$/i.test(file.name)) {
    showError('O arquivo precisa ter a extensão .dem. Se estiver compactado (.zip, .bz2), extraia antes.');
    return;
  }
  busy = true;
  errorBox.classList.remove('on');
  results.classList.remove('on');
  cards.innerHTML = '';
  dropzone.style.display = 'none';
  progressTitle.textContent = 'Analisando ' + file.name;
  setProgress(0);
  progress.classList.add('on');
  worker.postMessage({ file: file });
}

function showSnack(msg) {
  snackbar.textContent = msg;
  snackbar.classList.add('on');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => snackbar.classList.remove('on'), 3000);
}

function copyValue(text, btn) {
  const label = btn.dataset.label;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copiado';
    showSnack('Copiado para a área de transferência');
    setTimeout(() => { btn.textContent = label; }, 2000);
  }).catch(() => showSnack('Não foi possível copiar. Selecione o texto e copie manualmente.'));
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function rgba(c, mult) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + ((c[3] / 255) * (mult || 1)).toFixed(3) + ')';
}

function paintCrosshair(canvas, xh, size) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);
  const sh = crosshairShapes(xh);
  const k = Math.min(12, (size / 2 - 4) / sh.extent); // unidades do jogo -> pixels (ampliado)
  ctx.translate(size / 2, size / 2);
  ctx.scale(k, k);
  const fill = rgba(xh.color), line = rgba(xh.outlineColor);
  if (sh.ring) {
    if (sh.outline) { ctx.strokeStyle = line; ctx.lineWidth = sh.ring.w + 2; ctx.beginPath(); ctx.arc(0, 0, sh.ring.r, 0, 6.2832); ctx.stroke(); }
    ctx.strokeStyle = fill; ctx.lineWidth = sh.ring.w; ctx.beginPath(); ctx.arc(0, 0, sh.ring.r, 0, 6.2832); ctx.stroke();
  }
  if (sh.outline) {
    ctx.fillStyle = line;
    sh.rects.forEach(r => ctx.fillRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2));
  }
  ctx.fillStyle = fill;
  sh.rects.forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));
}

function supportBlock(label, value, emptyText) {
  const box = el('div', 'support');
  box.appendChild(el('div', 'lbl', label));
  box.appendChild(el('div', value ? 'txt' : 'txt empty', value || emptyText));
  return box;
}

function actionButton(label, value) {
  const btn = el('button', 'btn btn-text', label);
  btn.type = 'button';
  btn.dataset.label = label;
  btn.onclick = () => copyValue(value, btn);
  return btn;
}

function renderPlayer(p) {
  const card = el('article', 'card');
  const xh = p.crosshair_code ? decodeCrosshair(p.crosshair_code) : null;

  const media = el('div', 'card-media');
  if (xh) {
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'Prévia da mira de ' + (p.name || 'jogador'));
    paintCrosshair(canvas, xh, 140);
    media.appendChild(canvas);
    media.appendChild(el('div', 'cap', 'Prévia aproximada'));
  } else {
    media.appendChild(el('div', 'ph', (p.name || '?').trim().charAt(0) || '?'));
  }
  card.appendChild(media);

  const body = el('div', 'card-body');
  body.appendChild(el('h3', 'card-title', p.name || 'Sem nome'));
  body.appendChild(el('div', 'card-sub', 'SteamID ' + p.steamid));
  body.appendChild(supportBlock('Crosshair code', p.crosshair_code, 'Não encontrado neste demo'));
  body.appendChild(supportBlock('Viewmodel', p.viewmodel_cmd, 'Não encontrado neste demo'));
  card.appendChild(body);

  const actions = el('div', 'actions');
  if (p.crosshair_code) actions.appendChild(actionButton('Copiar mira', p.crosshair_code));
  if (p.viewmodel_cmd) actions.appendChild(actionButton('Copiar viewmodel', p.viewmodel_cmd));
  card.appendChild(actions);
  return card;
}

function showResults(data) {
  if (!data.length) {
    showError('Nenhum jogador foi encontrado. Confirme que é um demo de CS2 (não de CS:GO).');
    return;
  }
  resultCount.textContent = data.length + (data.length === 1 ? ' jogador' : ' jogadores');
  data.forEach(p => cards.appendChild(renderPlayer(p)));
  results.classList.add('on');
}

function showError(msg) {
  progress.classList.remove('on');
  dropzone.style.display = '';
  errorText.textContent = msg;
  errorBox.classList.add('on');
}

startWorker();
</script>
</body>
</html>
