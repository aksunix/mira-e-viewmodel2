<style>
:root {
  --primary: #D0BCFF; --on-primary: #381E72;
  --primary-container: #4F378B; --on-primary-container: #EADDFF;
  --secondary-container: #4A4458; --on-secondary-container: #E8DEF8;
  --surface: #141218; --surface-low: #1D1B20; --surface-high: #2B2930; --surface-highest: #36343B;
  --on-surface: #E6E0E9; --on-surface-variant: #CAC4D0;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E0E9; --inverse-on-surface: #322F35;
  --elev1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
  --elev2: 0 1px 2px rgba(0,0,0,.5), 0 2px 6px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: light) {
  :root {
    --primary: #6750A4; --on-primary: #FFFFFF;
    --primary-container: #EADDFF; --on-primary-container: #21005D;
    --secondary-container: #E8DEF8; --on-secondary-container: #1D192B;
    --surface: #FEF7FF; --surface-low: #F7F2FA; --surface-high: #ECE6F0; --surface-highest: #E6E0E9;
    --on-surface: #1D1B20; --on-surface-variant: #49454F;
    --outline: #79747E; --outline-variant: #CAC4D0;
    --inverse-surface: #322F35; --inverse-on-surface: #F5EFF7;
    --elev1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
    --elev2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--surface); color: var(--on-surface);
  font: 14px/20px Inter, Roboto, system-ui, sans-serif; letter-spacing: .25px;
  min-height: 100vh;
}
main { max-width: 1400px; margin: 0 auto; padding: 32px 20px 64px; }

.results-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.results-head h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 400; letter-spacing: 0; }
.results-head p { margin: 0; color: var(--on-surface-variant); }
.btn-tonal {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 20px 0 16px;
  border: 0; border-radius: 20px; background: var(--secondary-container); color: var(--on-secondary-container);
  font: 500 14px/20px Inter, Roboto, sans-serif; letter-spacing: .1px; text-decoration: none; cursor: pointer;
}
.btn-tonal:hover { filter: brightness(1.08); }

#cards { display: grid; gap: 16px; align-items: stretch; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
@media (min-width: 1240px) { #cards { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

.card {
  container: card / inline-size;
  display: flex; flex-direction: column; overflow: hidden; min-width: 0;
  background: var(--surface-low); border-radius: 16px; box-shadow: var(--elev1); transition: box-shadow .2s;
}
.card:hover { box-shadow: var(--elev2); }
.card-head { display: flex; align-items: center; gap: 12px; padding: 16px 16px 4px; }
.card-av {
  display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: var(--primary-container); color: var(--on-primary-container);
  font-size: 16px; font-weight: 500; text-transform: uppercase;
}
.card-title { flex: 1; margin: 0; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .15px; overflow-wrap: anywhere; }

.tabs { display: flex; margin-top: 8px; border-bottom: 1px solid var(--outline-variant); }
.tabs button {
  position: relative; flex: 1; height: 48px; border: 0; background: none; color: var(--on-surface-variant);
  font: 500 14px Inter, Roboto, sans-serif; letter-spacing: .1px; cursor: pointer; transition: background .15s, color .15s;
}
.tabs button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.tabs button::after {
  content: ""; position: absolute; left: 50%; bottom: -1px; width: 0; height: 3px; border-radius: 3px 3px 0 0;
  background: var(--primary); transform: translateX(-50%); transition: width .2s;
}
.tabs button[aria-selected="true"] { color: var(--primary); }
.tabs button[aria-selected="true"]::after { width: min(64px, 70%); }

.panes { display: grid; }
.pane { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 16px; padding: 16px; min-width: 0; }
.pane:not(.on) { visibility: hidden; }
.preview { display: grid; place-items: center; height: 112px; border-radius: 16px; background: var(--surface-highest); }
.preview canvas { width: 96px; height: 96px; }
.field { position: relative; margin-top: 2px; padding: 12px 14px; border: 1px solid var(--outline); border-radius: 12px; }
.field-label { position: absolute; top: -9px; left: 12px; padding: 0 4px; background: var(--surface-low); font-size: 12px; line-height: 16px; color: var(--on-surface-variant); }
.field pre { margin: 0; font: 12px/18px "Roboto Mono", ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--on-surface); user-select: all; }
.btn-filled {
  display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; margin-top: auto;
  border: 0; border-radius: 22px; background: var(--primary); color: var(--on-primary);
  font: 500 14px/20px Inter, Roboto, sans-serif; letter-spacing: .1px; cursor: pointer; transition: filter .12s;
}
.btn-filled:hover { filter: brightness(1.07); }
.empty { margin: 0; padding: 28px 0; text-align: center; color: var(--on-surface-variant); }

.actions { display: flex; align-items: center; margin: auto 8px 0; padding: 8px 0; border-top: 1px solid var(--outline-variant); }
.act {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-radius: 20px;
  background: transparent; color: var(--primary); text-decoration: none; white-space: nowrap;
  font: 500 13px/20px Inter, Roboto, sans-serif; letter-spacing: .1px; cursor: pointer;
}
.act:hover, .act[aria-expanded="true"] { background: color-mix(in srgb, var(--primary) 12%, transparent); }
.act.cfg { margin-left: auto; }
@container card (max-width: 245px) { .act { padding: 0 8px; font-size: 12px; gap: 4px; } }
.info { margin: 0 12px 12px; padding: 12px; border-radius: 12px; background: var(--surface-high); }
.info dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; }
.info dt { color: var(--on-surface-variant); }
.info dd { margin: 0; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.snackbar {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
  padding: 12px 16px; border-radius: 4px; background: var(--inverse-surface); color: var(--inverse-on-surface);
  box-shadow: var(--elev2); transition: opacity .2s, transform .2s;
}
.snackbar.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
// Decodifica o crosshair code do CS2 ("CS" + 44 caracteres) e calcula as formas para desenhar a mira.
// Formato conforme a biblioteca de codigo aberto csxhair (SyberiaK/csxhair).
(function (root) {
  const ALPHABET = 'ABCDEFGHJKLMNOPQRSTUVWXYZabcdefhijkmnopqrstuvwxyz23456789';
  const CODE_RE = /^CS[ABCDEFGHJKLMNOPQRSTUVWXYZabcdefhijkmnopqrstuvwxyz23456789]{44}$/;

  function decodeCrosshair(code) {
    code = String(code || '').trim();
    if (!CODE_RE.test(code)) return null;

    let num = 0n;
    const chars = code.slice(2);
    for (let i = chars.length - 1; i >= 0; i--) {
      num = num * 57n + BigInt(ALPHABET.indexOf(chars[i]));
    }
    const hex = num.toString(16).padStart(64, '0');
    if (hex.length !== 64) return null;
    const b = [];
    for (let i = 0; i < 64; i += 2) b.push(parseInt(hex.slice(i, i + 2), 16));

    let sum = 0;
    for (let i = 1; i < b.length; i++) sum += b[i];
    if (b[0] !== sum % 256) return null;

    const gapRaw = b[14] | (b[15] << 8);
    const dyn = (b[18] | (b[19] << 8) | (b[20] << 16) | (b[21] << 24)) >>> 0;
    return {
      style: b[4] & 31,
      recoil: !!(b[4] & 32),
      dot: !!(b[4] & 64),
      t: !!(b[4] & 128),
      color: [b[5], b[6], b[7], b[8]],
      outlineColor: [b[9], b[10], b[11], b[12]],
      thickness: b[13] & 31,
      drawOutline: (b[13] >> 6) & 3,
      gap: gapRaw >= 0x8000 ? gapRaw - 0x10000 : gapRaw,
      length: b[16],
      spreadLimit: b[17],
      splitDist: b[18] & 127,
      splitAlphaInner: Math.round(((dyn >>> 7) & 127)) / 100,
      splitAlphaOuter: Math.round(((dyn >>> 14) & 127)) / 100 + 0.3,
      splitRatio: Math.round(((dyn >>> 21) & 127)) / 100,
      ironsightUseColor: !!(b[21] & 16),
      ironsightDotScale: 0.1 + b[22] / 100,
      screenHeight: b[2] | (b[3] << 8),
    };
  }

  // Formas em "unidades do jogo", com o centro da mira em (0, 0).
  // E uma aproximacao estatica (sem o espalhamento ao atirar/andar).
  function crosshairShapes(xh) {
    const t = Math.max(xh.thickness, 0.5), L = xh.length, g = xh.gap;
    const rects = [];
    let ring = null;
    const isCircle = xh.style === 1 || xh.style === 3;
    const dotOnly = xh.style === 6;

    if (isCircle) {
      ring = { r: Math.max(g + L, 2), w: t };
    } else if (!dotOnly) {
      rects.push({ x: g, y: -t / 2, w: L, h: t });            // direita
      rects.push({ x: -(g + L), y: -t / 2, w: L, h: t });     // esquerda
      rects.push({ x: -t / 2, y: g, w: t, h: L });            // baixo
      if (!xh.t) rects.push({ x: -t / 2, y: -(g + L), w: t, h: L }); // cima (o estilo T nao tem)
    }
    if (xh.dot || dotOnly) rects.push({ x: -t / 2, y: -t / 2, w: t, h: t });

    let extent = 2;
    for (const r of rects) {
      extent = Math.max(extent, Math.abs(r.x), Math.abs(r.y), Math.abs(r.x + r.w), Math.abs(r.y + r.h));
    }
    if (ring) extent = Math.max(extent, ring.r + ring.w);
    if (xh.drawOutline) extent += 1;
    return { rects, ring, extent, outline: xh.drawOutline ? 1 : 0 };
  }

  const api = { decodeCrosshair, crosshairShapes };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else Object.assign(root, api);
})(typeof self !== 'undefined' ? self : this);

</script>

};
const MOUSE_FIELDS = [['dpi', 'DPI'], ['sensitivity', 'Sensibilidade'], ['edpi', 'eDPI'], ['zoom_sensitivity', 'Zoom'], ['hz', 'Hz']];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('class', 'i');
  s.setAttribute('aria-hidden', 'true');
  s.innerHTML = ICONS[name];
  return s;
}
function rgba(c, mult) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + ((c[3] / 255) * (mult || 1)).toFixed(3) + ')';
}
function paintCrosshair(canvas, xh, size) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);
  const sh = crosshairShapes(xh);
  ctx.translate(size / 2, size / 2);
  ctx.scale(1.2, 1.2);
  const fill = rgba(xh.color), line = rgba(xh.outlineColor);
  if (sh.ring) {
    if (sh.outline) { ctx.strokeStyle = line; ctx.lineWidth = sh.ring.w + 2; ctx.beginPath(); ctx.arc(0, 0, sh.ring.r, 0, 6.2832); ctx.stroke(); }
    ctx.strokeStyle = fill; ctx.lineWidth = sh.ring.w; ctx.beginPath(); ctx.arc(0, 0, sh.ring.r, 0, 6.2832); ctx.stroke();
  }
  if (sh.outline) {
    ctx.fillStyle = line;
    sh.rects.forEach(r => ctx.fillRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2));
  }
  ctx.fillStyle = fill;
  sh.rects.forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));
}

const snack = document.getElementById('snack');
let snackTimer;
function showSnack(msg) {
  snack.textContent = msg;
  snack.classList.add('on');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => snack.classList.remove('on'), 2400);
}
function copyValue(text, btn) {
  const t = btn.querySelector('.t');
  const done = () => {
    t.textContent = 'Copiado';
    showSnack('Copiado para a área de transferência');
    setTimeout(() => { t.textContent = 'Copiar'; }, 2000);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { showSnack('Não foi possível copiar. Selecione o texto e copie manualmente.'); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}

function codeField(label, value) {
  const f = el('div', 'field');
  f.append(el('span', 'field-label', label), el('pre', '', value));
  return f;
}
function copyButton(value) {
  const b = el('button', 'btn-filled');
  b.type = 'button';
  b.append(icon('copy'), el('span', 't', 'Copiar'));
  b.onclick = () => copyValue(value, b);
  return b;
}

function renderPlayer(p, n) {
  const name = (p.name || '').trim() || 'Sem nome';
  const card = el('article', 'card');

  const head = el('header', 'card-head');
  head.append(el('div', 'card-av', name.charAt(0)), el('h3', 'card-title', name));
  card.appendChild(head);

  const defs = [['Crosshair', 'Código da mira', p.crosshair_code, 'mira'], ['Viewmodel', 'Comandos do viewmodel', p.viewmodel_cmd, 'viewmodel']];
  const tabs = el('div', 'tabs');
  tabs.setAttribute('role', 'tablist');
  const panes = el('div', 'panes');
  const tabBtns = [], paneEls = [];

  defs.forEach(([tabLabel, fieldLabel, value, key], i) => {
    const pn = el('div', 'pane');
    pn.id = 'p' + n + '-' + key;
    pn.setAttribute('role', 'tabpanel');
    pn.setAttribute('aria-labelledby', 't' + n + '-' + key);
    const xh = i === 0 && value ? decodeCrosshair(value) : null;
    if (xh) {
      const media = el('div', 'preview');
      const c = document.createElement('canvas');
      c.setAttribute('role', 'img');
      c.setAttribute('aria-label', 'Prévia da mira de ' + name);
      paintCrosshair(c, xh, 140);
      media.appendChild(c);
      pn.appendChild(media);
    }
    if (value) pn.append(codeField(fieldLabel, value), copyButton(value));
    else pn.appendChild(el('p', 'empty', 'Este jogador não tem ' + tabLabel.toLowerCase() + ' neste demo.'));
    const b = el('button', '', tabLabel);
    b.type = 'button';
    b.id = 't' + n + '-' + key;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-controls', pn.id);
    b.onclick = () => select(i);
    b.onkeydown = (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { select(1 - i); tabBtns[1 - i].focus(); }
    };
    tabs.appendChild(b); tabBtns.push(b); paneEls.push(pn); panes.appendChild(pn);
  });
  function select(k) {
    tabBtns.forEach((b, i) => {
      b.setAttribute('aria-selected', String(i === k));
      b.tabIndex = i === k ? 0 : -1;
      paneEls[i].classList.toggle('on', i === k);
      paneEls[i].inert = i !== k;
    });
  }
  select(p.crosshair_code ? 0 : 1);
  card.append(tabs, panes);

  const mouse = p.mouse && MOUSE_FIELDS.some(([k]) => p.mouse[k]) ? p.mouse : null;
  const video = p.resolution || null;
  const actions = el('div', 'actions');
  const info = el('div', 'info');
  info.hidden = true;
  const toggles = [];
  function toggle(btn, build) {
    const open = btn.getAttribute('aria-expanded') !== 'true';
    toggles.forEach(t => t.setAttribute('aria-expanded', 'false'));
    info.hidden = !open;
    if (open) { btn.setAttribute('aria-expanded', 'true'); info.replaceChildren(build()); }
  }
  function addToggle(label, ic, build) {
    const b = el('button', 'act');
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.append(icon(ic), document.createTextNode(label));
    b.onclick = () => toggle(b, build);
    toggles.push(b); actions.appendChild(b);
  }
  if (mouse) addToggle('Mouse', 'mouse', () => {
    const dl = el('dl');
    MOUSE_FIELDS.forEach(([k, label]) => { if (mouse[k]) dl.append(el('dt', '', label), el('dd', '', mouse[k])); });
    return dl;
  });
  if (video) addToggle('Vídeo', 'monitor', () => {
    const dl = el('dl');
    dl.append(el('dt', '', 'Resolução'), el('dd', '', video));
    return dl;
  });
  if (p.steamid) {
    const a = el('a', 'act cfg');
    a.append(icon('download'), document.createTextNode('CFG'));
    a.href = 'https://cybershoke.net/api/api/v1/user/download/cfg/' + encodeURIComponent(String(p.steamid).trim());
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', 'CFG de ' + name + ' do CyberShoke');
    a.title = 'Abre a CFG deste jogador no CyberShoke (envia o SteamID para o CyberShoke)';
    actions.appendChild(a);
  }
  if (actions.children.length) card.append(actions, info);
  return card;
}

const cards = document.getElementById('cards');
PLAYERS.forEach((p, i) => cards.appendChild(renderPlayer(p, i)));
document.getElementById('count').textContent = DEMO_NAME + ' · ' + PLAYERS.length + ' jogadores · exemplo ilustrativo';
</script>
</body>
