<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CS2 extract crosshair and viewmodel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --md-primary: #6500F5; --md-on-primary: #FFFFFF;
    --md-primary-container: #32105D; --md-on-primary-container: #E9D7FF;
    --md-secondary-container: #252333; --md-on-secondary-container: #E8E4F3;
    --md-surface: #0D0E14; --md-surface-container-low: #151620;
    --md-surface-container: #191A25; --md-surface-container-high: #20212D;
    --md-surface-container-highest: #292A37; --md-on-surface: #F7F5FC;
    --md-on-surface-variant: #A8A5BA; --md-outline: #77738B;
    --md-outline-variant: #303140; --md-inverse-surface: #F7F5FC;
    --md-inverse-on-surface: #191A25; --md-error: #FFB4AB;
    --md-error-container: #5B171B; --md-on-error-container: #FFDAD6;
    --md-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --md-primary: #6500F5; --md-on-primary: #FFFFFF;
      --md-primary-container: #E9D7FF; --md-on-primary-container: #32105D;
      --md-secondary-container: #F0ECF8; --md-on-secondary-container: #282238;
      --md-surface: #F8F7FB; --md-surface-container-low: #FFFFFF;
      --md-surface-container: #F3F1F8; --md-surface-container-high: #EDEAF4;
      --md-surface-container-highest: #E5E1EF; --md-on-surface: #191620;
      --md-on-surface-variant: #625D70; --md-outline: #81798D;
      --md-outline-variant: #DDD7E8; --md-inverse-surface: #302B39;
      --md-inverse-on-surface: #F8F7FB; --md-error: #BA1A1A;
      --md-error-container: #FFDAD6; --md-on-error-container: #410002;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Roboto", system-ui, sans-serif;
    font-size: 14px; line-height: 20px; letter-spacing: .25px;
    background: var(--md-surface); color: var(--md-on-surface);
    min-height: 100vh;
  }

  /* Top app bar */
  .appbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px;
    height: 64px; padding: 0 16px 0 24px;
    background: var(--md-surface-container); color: var(--md-on-surface);
  }
  .appbar svg { fill: var(--md-primary); flex: none; }
  .brand { display: flex; align-items: center; gap: 16px; color: inherit; text-decoration: none; cursor: pointer; }
  .appbar h1 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: 0; }

  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 96px; }

  /* Dropzone */
  .dropzone {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 100%; padding: 48px 24px; text-align: center; font: inherit; color: inherit;
    background: var(--md-surface-container-low);
    border: 2px dashed var(--md-outline-variant); border-radius: 28px;
    cursor: pointer; transition: background .2s, border-color .2s;
  }
  .dropzone:hover { background: var(--md-surface-container); }
  .dropzone.hover { border-color: var(--md-primary); background: var(--md-surface-container-high); }
  .dropzone .icon {
    display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 8px;
    border-radius: 50%; background: var(--md-primary-container);
  }
  .dropzone .icon svg { fill: var(--md-on-primary-container); }
  .dropzone .title { font-size: 22px; line-height: 28px; letter-spacing: 0; }
  .dropzone .support { margin-top: 0; color: var(--md-on-surface-variant); }

  /* Buttons */
  .btn {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 38px; padding: 0 18px; border: 0; border-radius: 6px;
    font: 700 13px/20px "Roboto", system-ui, sans-serif; letter-spacing: .8px;
    cursor: pointer; transition: box-shadow .2s;
  }
  .btn svg { fill: currentColor; margin-left: -8px; }
  .btn::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
  .btn:hover::after { opacity: .08; }
  .btn:active::after { opacity: .12; }
  .btn-filled { background: var(--md-primary); color: var(--md-on-primary); margin-top: 16px; }
  .btn-filled:hover { box-shadow: var(--md-shadow); }
  .btn-tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .btn-tonal.done { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .actions .btn-text:hover { box-shadow: var(--md-shadow); filter: brightness(1.08); }
  .actions .btn-text:active { filter: brightness(.92); }
  .btn-text { background: var(--md-primary); color: #fff; padding: 0 14px; border-radius: 6px; }
  :focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }

  /* Progress */
  .progress { display: none; margin-top: 24px; }
  .progress.on { display: block; }
  .progress .label { margin-bottom: 12px; color: var(--md-on-surface-variant); }
  .progress .label strong { display: block; color: var(--md-on-surface); font-weight: 500; font-size: 16px; line-height: 24px; letter-spacing: .15px; }
  .linear { position: relative; height: 4px; border-radius: 2px; overflow: hidden; background: var(--md-secondary-container); }
  .linear .bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--md-primary); border-radius: 2px; transition: width .2s linear; }
  .linear.indeterminate .bar { width: 40%; transition: none; animation: slide 1.6s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  .dropzone:disabled { cursor: progress; opacity: .6; }
  .dropzone:disabled:hover { background: var(--md-surface-container-low); }

  /* Banner de erro */
  .error {
    display: none; gap: 12px; align-items: flex-start; margin-top: 24px; padding: 16px;
    border-radius: 12px; background: var(--md-error-container); color: var(--md-on-error-container);
  }
  .error.on { display: flex; }
  .error svg { fill: currentColor; flex: none; }
  .error strong { display: block; font-weight: 500; font-size: 16px; line-height: 24px; letter-spacing: .15px; }

  /* Resultados */
  .results { display: none; margin-top: 32px; }
  .results.on { display: block; }
  .results-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .results-head h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 400; letter-spacing: 0; }
  .results-head p { margin: 0; color: var(--md-on-surface-variant); }

  /* Cards (Material 3): midia, titulo, texto de apoio e acoes */
  #cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
  @media (max-width: 1000px) { #cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 700px) { #cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { #cards { grid-template-columns: minmax(0, 1fr); } }
  .card {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 12px;
  }
  .card-media {
    position: relative; display: grid; place-items: center; height: 112px;
    background: var(--md-surface-container-highest);
  }
  .card-media canvas { width: 96px; height: 96px; }
  .card-media .ph {
    display: grid; place-items: center; width: 80px; height: 80px; border-radius: 50%;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    font-size: 36px; line-height: 40px; font-weight: 500; text-transform: uppercase;
  }
  .card-media .cap { position: absolute; left: 12px; bottom: 8px; color: var(--md-on-surface-variant); font-size: 12px; line-height: 16px; letter-spacing: .4px; }
  .card-body { padding: 10px 12px 0; }
  .card-title { margin: 0; font-size: 17px; line-height: 23px; font-weight: 500; letter-spacing: 0; overflow-wrap: anywhere; }
  .card-sub { margin-top: 2px; color: var(--md-on-surface-variant); font-family: "Roboto Mono", ui-monospace, monospace; font-size: 12px; line-height: 16px; letter-spacing: .4px; }
  .support { margin-top: 10px; }
  .support + .support { margin-top: 8px; }
  .support .lbl { color: var(--md-on-surface-variant); font-size: 12px; line-height: 16px; letter-spacing: .5px; }
  .support .txt { margin-top: 2px; color: var(--md-on-surface-variant); font-family: "Roboto Mono", ui-monospace, monospace; font-size: 12px; line-height: 18px; letter-spacing: 0; overflow-wrap: anywhere; user-select: all; }
  .support .txt.empty { font-family: "Roboto", system-ui, sans-serif; font-size: 14px; letter-spacing: .25px; user-select: none; opacity: .8; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; padding: 12px; min-height: auto; }
  .split-action { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 2px; position: relative; }
  .cfg-link {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 34px; padding: 0 12px; border: 1px solid var(--md-outline-variant);
    border-radius: 6px; color: var(--md-on-surface); background: var(--md-surface-container-high);
    text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: .6px;
  }
  .cfg-link:hover { border-color: var(--md-primary); background: var(--md-primary-container); }

  .split-action .btn { margin: 0; height: 38px; }
  .split-main { border-radius: 6px 4px 4px 6px; width: 100%; padding: 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; }
  .split-toggle { background: var(--md-primary); color: #fff; border-radius: 4px 6px 6px 4px; padding: 0; }
  .split-toggle svg { margin: 0; transition: transform .18s ease; }
  .split-action.open .split-toggle svg { transform: rotate(180deg); }
  .code-panel {
    display: none; grid-column: 1 / -1; position: static; margin-top: 6px;
    padding: 10px; border: 1px solid var(--md-outline-variant); border-radius: 8px;
    background: var(--md-surface-container-high); box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }
  .split-action.open .code-panel { display: block; }
  .code-panel pre { margin: 0; color: var(--md-on-surface); font: 12px/1.55 "Roboto Mono", ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  .mouse-block { display: flex; flex-direction: column; }
  .mouse-btn { width: 100%; justify-content: space-between; text-transform: uppercase; letter-spacing: 1px; }
  .mouse-btn svg { margin: 0; transition: transform .18s ease; }
  .mouse-block.open .mouse-btn svg { transform: rotate(180deg); }
  .mouse-panel { display: none; margin-top: 6px; padding: 10px; border: 1px solid var(--md-outline-variant); border-radius: 8px; background: var(--md-surface-container-high); }
  .mouse-block.open .mouse-panel { display: block; }
  .mouse-panel dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; }
  .mouse-panel dt { color: var(--md-on-surface-variant); }
  .mouse-panel dd { margin: 0; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
  .mouse-panel .src { display: block; margin-top: 8px; font-size: 11px; color: var(--md-on-surface-variant); }
  .mouse-panel .src a { color: var(--md-primary); }
  .code-panel .code-copy { margin-top: 8px; height: 30px; padding: 0 12px; font-size: 11px; }


  /* Busca de jogador profissional */
  .search { position: relative; max-width: 640px; margin: 0 auto 24px; }
  .search-field { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-radius: 28px; background: var(--md-surface-container-high); border: 1px solid var(--md-outline-variant); }
  .search-field:focus-within { border-color: var(--md-primary); }
  .search-field svg { fill: var(--md-on-surface-variant); flex: none; }
  .search-field input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--md-on-surface); font: 400 16px/24px "Roboto", system-ui, sans-serif; letter-spacing: .5px; }
  .search-field input:focus-visible { outline: none; }
  .search-field input::placeholder { color: var(--md-on-surface-variant); }
  .suggest { display: none; position: absolute; left: 0; right: 0; top: 60px; z-index: 6; margin: 0; padding: 8px 0; list-style: none; max-height: 320px; overflow-y: auto; border-radius: 16px; background: var(--md-surface-container-high); border: 1px solid var(--md-outline-variant); box-shadow: var(--md-shadow); }
  .suggest.on { display: block; }
  .suggest li { padding: 10px 16px; cursor: pointer; }
  .suggest li[aria-selected="true"], .suggest li:hover { background: var(--md-secondary-container); }
  .suggest .tag { color: var(--md-on-surface-variant); font-size: 12px; }
  #searchResult { display: grid; grid-template-columns: minmax(0, 320px); justify-content: center; margin: 0 auto 24px; }
  #searchResult:empty { display: none; }
  .btn-outline { background: var(--md-surface-container-high); color: var(--md-on-surface); border: 1px solid var(--md-outline-variant); }

  @media (max-width: 600px) {
    .dropzone { padding: 32px 16px; }
  }

  /* Snackbar */
  .snackbar {
    position: fixed; left: 50%; bottom: 24px; z-index: 10;
    transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
    min-width: 280px; max-width: calc(100vw - 32px); padding: 14px 16px; border-radius: 4px;
    background: var(--md-inverse-surface); color: var(--md-inverse-on-surface);
    box-shadow: var(--md-shadow); transition: opacity .2s, transform .2s;
  }
  .snackbar.on { opacity: 1; transform: translate(-50%, 0); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .linear.indeterminate .bar { animation: none; left: 0; width: 100%; opacity: .5; }
  }
</style>
</head>
<body>

<header class="appbar">
  <a class="brand" href="./" aria-label="CS2 extract crosshair and viewmodel – voltar ao início" onclick="event.preventDefault(); location.reload();">
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    <h1>CS2 extract crosshair and viewmodel</h1>
  </a>
</header>

<main>
  <div class="search">
    <div class="search-field">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="search" id="proSearch" placeholder="Buscar jogador profissional (ex.: m0nesy)" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="suggest" aria-label="Buscar jogador profissional">
    </div>
    <ul class="suggest" id="suggest" role="listbox"></ul>
  </div>
  <div id="searchResult" aria-live="polite"></div>

  <button type="button" class="dropzone" id="dropzone">
    <span class="icon"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg></span>
    <span class="title">Arraste o arquivo .dem aqui</span>
    <span class="support">O arquivo é lido no seu computador e não é enviado para nenhum servidor</span>
    <span class="btn btn-filled" id="pick">Escolher arquivo</span>
  </button>
  <input type="file" id="fileInput" accept=".dem" class="sr" tabindex="-1">

  <section class="progress" id="progress" aria-live="polite">
    <div class="label"><strong id="progressTitle"></strong><span id="progressSub"></span></div>
    <div class="linear indeterminate" id="linear" role="progressbar" aria-label="Progresso da análise" aria-valuemin="0" aria-valuemax="100"><div class="bar" id="bar"></div></div>
  </section>

  <section class="error" id="error" role="alert">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <div><strong>Não foi possível analisar o demo</strong><span id="errorText"></span></div>
  </section>

  <section class="results" id="results">
    <div class="results-head">
      <div>
        <h2>Jogadores encontrados</h2>
        <p id="resultCount"></p>
      </div>
      <button type="button" class="btn btn-text" id="again">Analisar outro demo</button>
    </div>
    <div id="cards"></div>
  </section>
</main>

<div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

<script src="crosshair.js"></script>
<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const pick = document.getElementById('pick');
const progress = document.getElementById('progress');
const progressTitle = document.getElementById('progressTitle');
const progressSub = document.getElementById('progressSub');
const linear = document.getElementById('linear');
const bar = document.getElementById('bar');
const errorBox = document.getElementById('error');
const errorText = document.getElementById('errorText');
const results = document.getElementById('results');
const resultCount = document.getElementById('resultCount');
const cards = document.getElementById('cards');
const snackbar = document.getElementById('snackbar');
let snackTimer;
let busy = false;
let worker = null;

function setIndeterminate(title, sub) {
  progressTitle.textContent = title;
  progressSub.textContent = sub || '';
  linear.classList.add('indeterminate');
  linear.removeAttribute('aria-valuenow');
  bar.style.width = '';
}

function setProgress(pct) {
  linear.classList.remove('indeterminate');
  linear.setAttribute('aria-valuenow', pct);
  bar.style.width = pct + '%';
  progressSub.textContent = pct + '% do demo lido';
}

function failLoading(msg) {
  busy = false;
  progress.classList.remove('on');
  dropzone.disabled = true;
  pick.textContent = 'Indisponível';
  showError(msg);
}

function setLoading(on) {
  dropzone.disabled = on;
  if (on) {
    pick.textContent = 'Preparando o analisador…';
    setIndeterminate('Preparando o analisador', 'Só na primeira vez; o arquivo tem alguns MB.');
    progress.classList.add('on');
  } else {
    pick.textContent = 'Escolher arquivo';
    progress.classList.remove('on');
  }
}

function startWorker() {
  setLoading(true);
  try {
    worker = new Worker('worker.js');
  } catch (e) {
    failLoading('Seu navegador não conseguiu iniciar o analisador. Tente o Chrome, Edge ou Firefox atualizados.');
    return;
  }
  worker.onmessage = e => {
    const m = e.data;
    if (m.type === 'ready') {
      setLoading(false);
    } else if (m.type === 'progress') {
      setProgress(m.value);
    } else if (m.type === 'result') {
      busy = false;
      progress.classList.remove('on');
      showResults(JSON.parse(m.json));
    } else if (m.type === 'error') {
      if (m.fatal) { failLoading(m.message); return; }
      busy = false;
      setLoading(false);
      showError(m.message);
    }
  };
  worker.onerror = () => {
    failLoading('O analisador parou de responder. Isso pode acontecer com demos muito grandes em aparelhos com pouca memória. Recarregue a página e tente de novo.');
  };
}

// Evita que o navegador abra o .dem se for solto fora da caixa (ou durante o carregamento)
['dragover', 'drop'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

dropzone.onclick = () => { if (!dropzone.disabled) fileInput.click(); };
dropzone.ondragover = e => { e.preventDefault(); if (!dropzone.disabled) dropzone.classList.add('hover'); };
dropzone.ondragleave = () => dropzone.classList.remove('hover');
dropzone.ondrop = e => {
  e.preventDefault();
  dropzone.classList.remove('hover');
  if (!dropzone.disabled && e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => {
  if (fileInput.files.length) processFile(fileInput.files[0]);
  fileInput.value = '';
};
document.getElementById('again').onclick = () => {
  results.classList.remove('on');
  dropzone.style.display = '';
  window.scrollTo({ top: 0 });
};

function processFile(file) {
  if (busy) return;
  if (!/\.dem$/i.test(file.name)) {
    showError('O arquivo precisa ter a extensão .dem. Se estiver compactado (.zip, .bz2), extraia antes.');
    return;
  }
  busy = true;
  errorBox.classList.remove('on');
  results.classList.remove('on');
  cards.innerHTML = '';
  dropzone.style.display = 'none';
  progressTitle.textContent = 'Analisando ' + file.name;
  setProgress(0);
  progress.classList.add('on');
  worker.postMessage({ file: file });
}

function showSnack(msg) {
  snackbar.textContent = msg;
  snackbar.classList.add('on');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => snackbar.classList.remove('on'), 3000);
}

function copyValue(text, btn) {
  const label = btn.dataset.label;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copiado';
    showSnack('Copiado para a área de transferência');
    setTimeout(() => { btn.textContent = label; }, 2000);
  }).catch(() => showSnack('Não foi possível copiar. Selecione o texto e copie manualmente.'));
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function rgba(c, mult) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + ((c[3] / 255) * (mult || 1)).toFixed(3) + ')';
}

function paintCrosshair(canvas, xh, size) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, size, size);
  const sh = crosshairShapes(xh);
  // Pequeno zoom para deixar a mira mais visível no card.
  const k = 1.2;
  ctx.translate(size / 2, size / 2);
  ctx.scale(k, k);
  const fill = rgba(xh.color), line = rgba(xh.outlineColor);
  if (sh.ring) {
    if (sh.outline) { ctx.strokeStyle = line; ctx.lineWidth = sh.ring.w + 2; ctx.beginPath(); ctx.arc(0, 0, sh.ring.r, 0, 6.2832); ctx.stroke(); }
    ctx.strokeStyle = fill; ctx.lineWidth = sh.ring.w; ctx.beginPath(); ctx.arc(0, 0, sh.ring.r, 0, 6.2832); ctx.stroke();
  }
  if (sh.outline) {
    ctx.fillStyle = line;
    sh.rects.forEach(r => ctx.fillRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2));
  }
  ctx.fillStyle = fill;
  sh.rects.forEach(r => ctx.fillRect(r.x, r.y, r.w, r.h));
}

function splitActionButton(label, value) {
  const group = el('div', 'split-action');
  const main = el('button', 'btn btn-text split-main', label);
  main.type = 'button';
  main.dataset.label = label;
  main.setAttribute('aria-label', label);
  main.onclick = () => copyValue(value, main);

  const toggle = el('button', 'btn split-toggle');
  toggle.type = 'button';
  toggle.setAttribute('aria-label', 'Mostrar código: ' + label.toLowerCase());
  toggle.setAttribute('aria-expanded', 'false');
  toggle.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>';

  const panel = el('div', 'code-panel');
  const pre = el('pre', '', value);
  panel.appendChild(pre);
  toggle.onclick = () => {
    const open = group.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  };
  group.append(main, toggle, panel);
  return group;
}

let proSettings = {};
let proNames = {};
const proSettingsReady = fetch('pro-settings.json')
  .then(r => (r.ok ? r.json() : { players: {} }))
  .then(j => { proSettings = (j && j.players) || {}; proNames = (j && j.names) || {}; })
  .catch(() => {});

const MOUSE_FIELDS = [
  ['sensitivity', 'Sensitivity'],
  ['dpi', 'DPI'],
  ['edpi', 'eDPI'],
  ['zoom_sensitivity', 'Zoom Sensitivity'],
  ['hz', 'Hz'],
];

function mouseBlock(info) {
  const group = el('div', 'mouse-block');
  const btn = el('button', 'btn btn-text mouse-btn');
  btn.type = 'button';
  btn.setAttribute('aria-expanded', 'false');
  btn.append(document.createTextNode('Mouse'));
  btn.insertAdjacentHTML('beforeend', '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>');

  const panel = el('div', 'mouse-panel');
  const dl = el('dl');
  MOUSE_FIELDS.forEach(([key, label]) => {
    if (!info[key]) return;
    dl.appendChild(el('dt', '', label));
    dl.appendChild(el('dd', '', info[key]));
  });
  panel.appendChild(dl);
  const src = el('span', 'src', 'Fonte: ');
  const link = el('a', '', 'ProSettings');
  link.href = info.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  src.appendChild(link);
  panel.appendChild(src);

  btn.onclick = () => {
    const open = group.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(open));
  };
  group.append(btn, panel);
  return group;
}

function renderPlayer(p) {
  const card = el('article', 'card');
  const xh = p.crosshair_code ? decodeCrosshair(p.crosshair_code) : null;

  const media = el('div', 'card-media');
  if (xh) {
    const canvas = document.createElement('canvas');
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'Prévia da mira de ' + (p.name || 'jogador'));
    paintCrosshair(canvas, xh, 140);
    media.appendChild(canvas);
  } else {
    media.appendChild(el('div', 'ph', (p.name || '?').trim().charAt(0) || '?'));
  }
  card.appendChild(media);

  const body = el('div', 'card-body');
  body.appendChild(el('h3', 'card-title', p.name || 'Sem nome'));
  card.appendChild(body);

  const actions = el('div', 'actions');
  if (p.crosshair_code) actions.appendChild(splitActionButton('Copiar mira', p.crosshair_code));
  if (p.viewmodel_cmd) actions.appendChild(splitActionButton('Copiar viewmodel', p.viewmodel_cmd));
  const mouse = proSettings[String(p.steamid)];
  if (mouse) actions.appendChild(mouseBlock(mouse));
  if (p.steamid) {
    const playerName = (p.name || 'jogador').trim();
    const cfgLink = el('a', 'cfg-link', 'BAIXAR CFG');
    cfgLink.href = 'https://cybershoke.net/api/api/v1/user/download/cfg/' + encodeURIComponent(String(p.steamid).trim());
    cfgLink.target = '_blank';
    cfgLink.rel = 'noopener noreferrer';
    cfgLink.setAttribute('aria-label', 'Baixar CFG de ' + playerName + ' do CyberShoke');
    cfgLink.title = 'Abre a CFG deste jogador no CyberShoke (envia o SteamID para o CyberShoke)';
    actions.appendChild(cfgLink);
  }
  card.appendChild(actions);
  return card;
}

async function showResults(data) {
  await proSettingsReady;
  if (!data.length) {
    showError('Nenhum jogador foi encontrado. Confirme que é um demo de CS2 (não de CS:GO).');
    return;
  }
  resultCount.textContent = data.length + (data.length === 1 ? ' jogador' : ' jogadores');
  data.forEach(p => cards.appendChild(renderPlayer(p)));
  results.classList.add('on');
}

function showError(msg) {
  progress.classList.remove('on');
  dropzone.style.display = '';
  errorText.textContent = msg;
  errorBox.classList.add('on');
}

// ---------- Busca de jogador profissional ----------
const CFG_URL = id => 'https://cybershoke.net/api/api/v1/user/download/cfg/' + encodeURIComponent(String(id).trim());
const proSearch = document.getElementById('proSearch');
const suggest = document.getElementById('suggest');
const searchResult = document.getElementById('searchResult');
let proIndex = null, suggestItems = [], suggestSel = -1;

function normName(n) { return String(n || '').replace(/\s+/g, '').toLowerCase(); }

function buildIndex() {
  if (proIndex) return proIndex;
  const sidByUrl = {};
  Object.keys(proSettings).forEach(sid => { if (proSettings[sid].url) sidByUrl[proSettings[sid].url] = sid; });
  const map = new Map();
  Object.keys(proNames).forEach(k => {
    const e = proNames[k];
    map.set(k, { key: k, name: e.name || k, info: e, steamid: sidByUrl[e.url] || null });
  });
  // jogadores que so aparecem pelo SteamID
  Object.keys(proSettings).forEach(sid => {
    const e = proSettings[sid], k = normName(e.name);
    if (k && !map.has(k)) map.set(k, { key: k, name: e.name, info: e, steamid: sid });
  });
  Object.keys(csLinks).forEach(k => {
    if (!map.has(k)) map.set(k, { key: k, name: csLinks[k].name || k, info: null, steamid: null });
  });
  proIndex = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
  return proIndex;
}

function searchPlayers(q) {
  const k = normName(q);
  if (!k) return [];
  const idx = buildIndex();
  const score = p => (p.key === k ? 0 : p.key.startsWith(k) ? 1 : p.key.includes(k) ? 2 : 9);
  return idx.map(p => [score(p), p]).filter(x => x[0] < 9)
    .sort((a, b) => a[0] - b[0] || (b[1].steamid ? 1 : 0) - (a[1].steamid ? 1 : 0) || a[1].name.length - b[1].name.length)
    .slice(0, 8).map(x => x[1])
    .concat(idx.some(p => p.key === k) ? [] : [{ key: k, name: q.trim(), info: null, steamid: null, custom: true }]);
}

function closeSuggest() {
  suggest.classList.remove('on');
  proSearch.setAttribute('aria-expanded', 'false');
  suggestSel = -1;
}

function paintSuggest() {
  suggest.innerHTML = '';
  suggestItems.forEach((p, i) => {
    const li = el('li');
    li.setAttribute('role', 'option');
    li.setAttribute('aria-selected', String(i === suggestSel));
    li.append(el('span', '', p.name));
    li.onmousedown = e => { e.preventDefault(); choosePlayer(p); };
    suggest.appendChild(li);
  });
  suggest.classList.toggle('on', suggestItems.length > 0);
  proSearch.setAttribute('aria-expanded', String(suggestItems.length > 0));
}

proSearch.addEventListener('input', async () => {
  await Promise.all([proSettingsReady, csLinksReady]);
  suggestItems = searchPlayers(proSearch.value);
  suggestSel = suggestItems.length ? 0 : -1;
  paintSuggest();
});
proSearch.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && suggestItems.length) { e.preventDefault(); suggestSel = (suggestSel + 1) % suggestItems.length; paintSuggest(); }
  else if (e.key === 'ArrowUp' && suggestItems.length) { e.preventDefault(); suggestSel = (suggestSel - 1 + suggestItems.length) % suggestItems.length; paintSuggest(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (suggestItems[suggestSel]) choosePlayer(suggestItems[suggestSel]); }
  else if (e.key === 'Escape') closeSuggest();
});
proSearch.addEventListener('blur', closeSuggest);

// FACEIT_NICKS (opcional): nick exato da FACEIT (minusculo -> nick), usado se o JSON de links nao tiver o jogador.
const FACEIT_NICKS = {};

function proLinks(p) {
  const k = normName(p.name), q = encodeURIComponent(p.name);
  const links = [];
  const fn = FACEIT_NICKS[k];
  links.push(fn
    ? ['FACEIT', 'https://www.faceit.com/en/players/' + encodeURIComponent(fn)]
    : ['FACEIT', 'https://duckduckgo.com/?q=' + encodeURIComponent('site:faceit.com/en/players ' + p.name)]);
  links.push(['HLTV', 'https://www.hltv.org/search?query=' + q]);
  return links;
}

// FACEIT/HLTV: coletados no GitHub Actions pelo CyberShoke (scripts/build_cybershoke_links.py).
// O navegador nao consegue consultar o CyberShoke direto (CORS), entao o site le o JSON pronto.
let csLinks = {};
const csLinksReady = fetch('cybershoke-links.json')
  .then(r => (r.ok ? r.json() : {}))
  .then(j => { csLinks = (j && j.links) || {}; })
  .catch(() => {});
function safeUrl(u, host) {
  try { const x = new URL(u); return x.protocol === 'https:' && x.hostname.endsWith(host) ? x.href : null; } catch (e) { return null; }
}
async function fetchProData(p) {
  await csLinksReady;
  const e = csLinks[normName(p.name)];
  if (!e) return { err: 'ainda não coletei o perfil deste jogador (a coleta roda todo dia no GitHub)' };
  const fu = e.faceit && safeUrl(e.faceit.url, 'faceit.com');
  const hu = e.hltv && safeUrl(e.hltv.url, 'hltv.org');
  return {
    faceit: fu ? { url: fu.replace('/ru/', '/en/'), level: e.faceit.skill_level, elo: e.faceit.elo } : null,
    hltv: hu ? { url: hu } : null,
  };
}

function renderSearchCard(p) {
  const card = el('article', 'card');
  const media = el('div', 'card-media');
  media.appendChild(el('div', 'ph', (p.name || '?').trim().charAt(0) || '?'));
  card.appendChild(media);

  const body = el('div', 'card-body');
  body.appendChild(el('h3', 'card-title', p.name));
  card.appendChild(body);

  const actions = el('div', 'actions');
  card.appendChild(actions);

  const linkEls = proLinks(p).map(([label, href]) => {
    const a = el('a', 'cfg-link', label);
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    actions.appendChild(a);
    return a;
  });

  fetchProData(p).then(d => {
    if (!d || !card.isConnected) return;
    if (d.faceit) { linkEls[0].href = d.faceit.url; linkEls[0].title = [d.faceit.level ? 'nível ' + d.faceit.level : '', d.faceit.elo ? d.faceit.elo + ' elo' : ''].filter(Boolean).join(' · '); }
    if (d.hltv) linkEls[1].href = d.hltv.url;
  });
  return card;
}

function choosePlayer(p) {
  proSearch.value = p.name;
  closeSuggest();
  searchResult.innerHTML = '';
  searchResult.appendChild(renderSearchCard(p));
}

startWorker();
</script>
