name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolver dependências do parser
        run: |
          go mod tidy
          go mod verify
          go version

      - name: Compilar o analisador para WebAssembly
        run: |
          GOOS=js GOARCH=wasm go build -o docs/parser.wasm ./wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js
          ls -lh docs

      - name: Incluir dados do ProSettings
        run: |
          if [ -f data/pro-settings.json ]; then cp data/pro-settings.json docs/pro-settings.json; else echo '{"players":{}}' > docs/pro-settings.json; fi

      - name: Incluir links de FACEIT/HLTV
        run: |
          if [ -f data/cybershoke-links.json ]; then cp data/cybershoke-links.json docs/cybershoke-links.json; else echo '{"links":{}}' > docs/cybershoke-links.json; fi

      - name: Incluir Top 20 e times
        run: |
          if [ -f data/pro-meta.json ]; then cp data/pro-meta.json docs/pro-meta.json; else echo '{"top":[],"players":[]}' > docs/pro-meta.json; fi

      - name: Incluir miras dos profissionais
        run: |
          if [ -f data/crosshairs.json ]; then cp data/crosshairs.json docs/crosshairs.json; else echo '{"players":{}}' > docs/crosshairs.json; fi

      - name: Minificar JSON
        run: |
          python3 - <<'PY'
          import json
          for f in ("pro-settings", "cybershoke-links", "crosshairs", "pro-meta"):
              p = f"docs/{f}.json"
              with open(p, encoding="utf-8") as fh:
                  j = json.load(fh)
              with open(p, "w", encoding="utf-8") as fh:
                  json.dump(j, fh, ensure_ascii=False, separators=(",", ":"))
          PY

      - name: Gravar data da atualização
        run: sed -i "s#__BUILD_DATE__#$(TZ=America/Sao_Paulo date +%d/%m/%Y)#" docs/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
