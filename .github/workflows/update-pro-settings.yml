name: Atualizar dados do ProSettings

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Maximo de paginas por execucao"
        default: "400"

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Coletar dados
        run: python scripts/build_pro_settings.py --out data/pro-settings.json --max "${{ github.event.inputs.max || '400' }}"

      - name: Coletar FACEIT/HLTV pelo CyberShoke
        continue-on-error: true
        run: python scripts/build_cybershoke_links.py --out data/cybershoke-links.json

      - name: Salvar e republicar o site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pro-settings.json data/cybershoke-links.json data/cybershoke-extra.txt
          if git diff --cached --quiet; then echo "Sem mudancas"; exit 0; fi
          git commit -m "Atualiza dados do ProSettings"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push falhou (tentativa $i), tentando de novo..."
            sleep 5
          done
          git push --dry-run >/dev/null 2>&1 || { echo "Nao foi possivel enviar o commit"; exit 1; }
          gh workflow run pages.yml
